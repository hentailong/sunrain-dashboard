name: Collect public metrics

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-metrics-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: public-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Configure data commits
        run: |
          git -C public-data config user.name 'github-actions[bot]'
          git -C public-data config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect and publish
        run: python -m backend.actions_worker --data-dir public-data --minutes 330
