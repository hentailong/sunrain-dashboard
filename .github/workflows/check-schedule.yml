name: Verify programme schedule
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read programme schedule
        run: |
          curl --fail --location --max-time 30 --user-agent 'Mozilla/5.0' 'https://www.tvmao.com/kanju/YGsmXGVe/playingtime' -o schedule.html
      - uses: actions/upload-artifact@v4
        with:
          name: public-programme-schedule
          path: schedule.html
          retention-days: 1
